name = "skitta"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"
# De Worker eerst, zodat http:// altijd naar https:// gaat (anders verdwijnt het inlogcookie).
run_worker_first = true

# Grote bijlagen (> 5 MB) op de eigen bestandsserver (server/), via een Cloudflare Tunnel.
[vars]
FILES_URL = "https://bestanden.timvanbergen.nl"

[[d1_databases]]
binding = "DB"
database_name = "skitta-db"
database_id = "1097703c-52e1-4bcf-8195-589fdc8a7c52"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Bijlagen (versleuteld). Grenzen staan in src/limits.js, zodat we binnen het gratis deel van R2 blijven.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "skitta-media"

# Elk kwartier verlopen (verdwijnende) berichten opruimen. Cron-taken zijn gratis.
[triggers]
crons = ["*/15 * * * *"]

[[routes]]
pattern = "skitta.timvanbergen.nl"
custom_domain = true
