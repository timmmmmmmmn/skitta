name: Apps bouwen

# Windows- en Mac-app (Rust) en de Android-app. Werkt zodra Skitta op GitHub staat; de Android-sleutel
# komt uit de geheime instellingen SKITTA_KEYSTORE_BASE64, SKITTA_KEYSTORE_PASSWORD, SKITTA_KEY_ALIAS, SKITTA_KEY_PASSWORD.
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'android/**', '.github/workflows/apps.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: Skitta-windows
          path: desktop/target/release/skitta.exe

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - run: ./bundle.sh && ditto -c -k --keepParent target/Skitta.app Skitta-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Skitta-mac
          path: desktop/Skitta-mac.zip

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/skitta-release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.SKITTA_KEYSTORE_BASE64 }}
      - run: ./gradlew assembleRelease --no-configuration-cache --console=plain
        env:
          SKITTA_KEYSTORE: ${{ runner.temp }}/skitta-release.jks
          SKITTA_KEYSTORE_PASSWORD: ${{ secrets.SKITTA_KEYSTORE_PASSWORD }}
          SKITTA_KEY_ALIAS: ${{ secrets.SKITTA_KEY_ALIAS }}
          SKITTA_KEY_PASSWORD: ${{ secrets.SKITTA_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Skitta-android
          path: android/app/build/outputs/apk/release/app-release.apk
