name: Apps bouwen

# Windows- en Mac-app (Rust). De Android-app wordt lokaal gebouwd (de ondertekeningssleutel staat niet op GitHub).
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/apps.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: Skitta-windows
          path: desktop/target/release/skitta.exe

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - run: ./bundle.sh && ditto -c -k --keepParent target/Skitta.app Skitta-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Skitta-mac
          path: desktop/Skitta-mac.zip
