<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skitta</title>
  <meta name="theme-color" content="#00aff0">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Skitta">
  <link rel="icon" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/mobile.css">
  <link rel="stylesheet" href="/mobile-themes.css">
  <script src="/theme.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <!-- Aanmelden / account maken -->
  <div id="auth" class="auth" hidden>
    <div class="auth-box">
      <img class="auth-logo" src="/img/logo.png" alt="">
      <div class="auth-word">Skitta</div>

      <form id="login-form" class="auth-form" autocomplete="on">
        <label for="l-name">Skittanaam</label>
        <input id="l-name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="l-pass">Wachtwoord</label>
        <input id="l-pass" name="password" type="password" autocomplete="current-password" required>
        <div class="auth-err" id="login-err" role="alert"></div>
        <button class="big-btn" type="submit">Aanmelden</button>
        <label class="check"><input type="checkbox" id="l-remember" checked> Aangemeld blijven</label>
        <label class="check status-pick">Status bij aanmelden:
          <select id="l-presence">
            <option value="online">Online</option>
            <option value="away">Afwezig</option>
            <option value="dnd">Niet storen</option>
            <option value="invisible">Onzichtbaar</option>
          </select>
        </label>
        <div class="auth-links">
          <a href="#" id="to-register">Hebt u geen Skittanaam?</a>
          <a href="#" id="forgot">Kunt u zich niet aanmelden?</a>
        </div>
      </form>

      <form id="register-form" class="auth-form" hidden autocomplete="on">
        <h2>Account maken</h2>
        <label for="r-display">Volledige naam</label>
        <input id="r-display" name="name" autocomplete="name" required maxlength="60">
        <label for="r-name">Skittanaam</label>
        <input id="r-name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="32">
        <div class="hint">Dit is de naam waarmee vrienden je vinden. Kleine letters, cijfers, punt, - of _.</div>
        <label for="r-pass">Wachtwoord</label>
        <input id="r-pass" name="password" type="password" autocomplete="new-password" required minlength="8">
        <label for="r-pass2">Wachtwoord herhalen</label>
        <input id="r-pass2" type="password" autocomplete="new-password" required minlength="8">
        <label for="r-email">E-mailadres</label>
        <input id="r-email" name="email" type="email" autocomplete="email" required>
        <div class="auth-err" id="register-err" role="alert"></div>
        <button class="big-btn" type="submit">Ik ga akkoord – Account maken</button>
        <div class="auth-links"><a href="#" id="to-login">Ik heb al een account</a></div>
      </form>
    </div>
  </div>

  <!-- De app -->
  <div id="app" class="app" hidden>
    <nav class="menubar" id="menubar"></nav>
    <div class="main">
      <aside class="side">
        <!-- Kop van de oude telefoonapps (alleen in de telefoonversies) -->
        <div class="mhead" id="mhead">
          <button class="mh-btn mh-left" id="mh-left" data-nav="more"><span class="mi-svg" data-icon="menu"></span><span class="mh-lbl"></span></button>
          <span class="mh-logo"><img src="/img/favicon.png" alt="">skitta</span>
          <b class="mh-title" id="mh-title"></b>
          <button class="mh-btn mh-search" id="mh-search" title="Zoeken"><span class="mi-svg" data-icon="search"></span></button>
          <button class="mh-btn mh-add" data-nav="add" title="Toevoegen"><span class="mi-svg" data-icon="plus"></span></button>
          <button class="mh-btn mh-more" data-nav="more" title="Meer"><span class="mi-svg" data-icon="more"></span></button>
          <button class="avatar mh-me" id="mh-me" title="Profiel"></button>
        </div>
        <div class="mtabs" id="mtabs">
          <button data-nav="recent"><span class="mi-svg" data-icon="clock"></span><span class="mt-lbl">Recent</span><b class="mt-count"></b></button>
          <button data-nav="contacts"><span class="mi-svg" data-icon="user"></span><span class="mt-lbl">Contacten</span></button>
          <button data-nav="calls"><span class="mi-svg" data-icon="phone"></span><span class="mt-lbl">Bellen</span></button>
        </div>
        <div class="me">
          <button class="avatar me-avatar" id="me-avatar" title="Profiel bewerken"></button>
          <div class="me-info">
            <button class="me-status" id="me-status"><span class="st" id="me-st"></span><span id="me-name"></span><span class="caret"></span></button>
            <input class="me-mood" id="me-mood" placeholder="Vertel je contactpersonen wat je aan het doen bent" maxlength="200">
          </div>
        </div>
        <!-- Werkbalk van de oude computerversies -->
        <div class="toolbar" id="toolbar">
          <button data-act="home" title="Skitta Home"><span class="mi-svg" data-icon="home"></span><span>Home</span></button>
          <button data-act="add" title="Contactpersoon toevoegen"><span class="mi-svg" data-icon="adduser"></span><span>Toevoegen</span></button>
          <button data-act="search" title="Zoeken"><span class="mi-svg" data-icon="search"></span><span>Zoeken</span></button>
          <button data-act="group" title="Groep maken"><span class="mi-svg" data-icon="people"></span><span>Vergadering</span></button>
          <button data-act="chat" title="Chatten"><span class="mi-svg" data-icon="chat"></span><span>Chat</span></button>
          <button data-act="calls" title="Bellen"><span class="mi-svg" data-icon="dialpad"></span><span>Bellen</span></button>
        </div>
        <button class="home-link" id="home-link"><img src="/img/favicon.png" alt=""> Skitta Home</button>
        <div class="search"><input id="search" type="search" placeholder="Zoeken" autocomplete="off"></div>
        <div class="tabs" role="tablist">
          <button role="tab" id="tab-contacts" class="on">Contactpersonen</button>
          <button role="tab" id="tab-recent">Recent <span class="tab-count" id="recent-count"></span></button>
        </div>
        <div class="list" id="list"></div>
        <!-- Adresbalk met de groene en rode knop (1.0 – 3.0, Mac 2) -->
        <div class="dialbar" id="dialbar">
          <input id="dial-input" list="dial-names" placeholder="Typ een Skittanaam en druk op de groene knop" autocomplete="off">
          <datalist id="dial-names"></datalist>
          <div class="dial-btns">
            <button class="dial-call" id="dial-call" title="Bellen"><span class="mi-svg" data-icon="phone"></span></button>
            <button class="dial-hang" id="dial-hang" title="Ophangen"><span class="mi-svg" data-icon="hangup"></span></button>
          </div>
        </div>
        <div class="side-foot">
          <button id="add-contact-btn" title="Contactpersoon toevoegen"><span class="ico ico-add"></span>Contact</button>
          <button id="new-group-btn" title="Groep maken"><span class="ico ico-group"></span>Groep maken</button>
        </div>
        <!-- Statusbalk onderaan (1.0 – 3.0, Mac 2) -->
        <div class="statusbar" id="statusbar"><span class="st" id="sb-st"></span><span id="sb-status"></span><span class="sb-count" id="sb-count"></span></div>
      </aside>
      <div class="splitter" id="splitter"></div>
      <section class="pane" id="pane"></section>
    </div>
  </div>

  <!-- Zwevende navigatie op de telefoon (in de Android-app tekent de app hier glas overheen) -->
  <nav class="mnav" id="mnav" hidden>
    <div class="mnav-pill" id="mnav-pill">
      <button data-nav="recent"><span class="mi-svg" data-icon="chat"></span><span>Chats</span><b class="mnav-count" id="mnav-count"></b></button>
      <button data-nav="contacts"><span class="mi-svg" data-icon="user"></span><span>Contacten</span></button>
      <button data-nav="calls"><span class="mi-svg" data-icon="phone"></span><span>Bellen</span></button>
      <button data-nav="more"><span class="mi-svg" data-icon="menu"></span><span>Meer</span></button>
    </div>
    <button class="mnav-add" id="mnav-add" data-nav="add" title="Toevoegen"><span class="mi-svg" data-icon="plus"></span></button>
  </nav>

  <div id="layer"></div>
  <div id="toasts" class="toasts"></div>
  <audio id="remote-audio" autoplay></audio>
</body>
</html>
